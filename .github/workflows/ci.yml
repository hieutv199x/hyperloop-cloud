name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hyperloop-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hyperloop-contracts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integrations:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hyperloop-contracts/package-lock.json
            hyperloop-integrations/package-lock.json
      - run: npm ci
        working-directory: hyperloop-contracts
      - run: npm run build
        working-directory: hyperloop-contracts
      - run: npm ci
        working-directory: hyperloop-integrations
      - run: npm run lint
        working-directory: hyperloop-integrations
      - run: npm test
        working-directory: hyperloop-integrations
      - run: npm run build
        working-directory: hyperloop-integrations

  agent-runtime:
    needs: [contracts, integrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hyperloop-contracts/package-lock.json
            hyperloop-integrations/package-lock.json
            hyperloop-agent-runtime/package-lock.json
      - run: npm ci && npm run build
        working-directory: hyperloop-contracts
      - run: npm ci && npm run build
        working-directory: hyperloop-integrations
      - run: npm ci
        working-directory: hyperloop-agent-runtime
      - run: npm run lint
        working-directory: hyperloop-agent-runtime
      - run: npm test
        working-directory: hyperloop-agent-runtime
      - run: npm run build
        working-directory: hyperloop-agent-runtime

  control-plane:
    needs: [contracts, integrations, agent-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hyperloop-contracts/package-lock.json
            hyperloop-integrations/package-lock.json
            hyperloop-agent-runtime/package-lock.json
            hyperloop-control-plane/package-lock.json
      - run: npm ci && npm run build
        working-directory: hyperloop-contracts
      - run: npm ci && npm run build
        working-directory: hyperloop-integrations
      - run: npm ci && npm run build
        working-directory: hyperloop-agent-runtime
      - run: npm ci
        working-directory: hyperloop-control-plane
      - run: npm run lint
        working-directory: hyperloop-control-plane
      - run: npm test
        working-directory: hyperloop-control-plane
      - name: Architecture gate — no Kiro in control-plane source
        run: |
          set +e
          hits=$(grep -REn 'agent-runtime|invokeKiro|\bkiro\b' hyperloop-control-plane/src \
            --exclude-dir=node_modules 2>/dev/null \
            | grep -Ev 'AGENT_IMAGE_|kiro-agent-|nexus\.example/hyperloop/kiro' || true)
          set -e
          if [ -n "$hits" ]; then
            echo "$hits"
            echo 'Forbidden Kiro/agent-runtime reference in control-plane/src'
            exit 1
          fi

  e2e:
    needs: [contracts, integrations, agent-runtime, control-plane]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hyperloop-contracts/package-lock.json
            hyperloop-integrations/package-lock.json
            hyperloop-agent-runtime/package-lock.json
            hyperloop-control-plane/package-lock.json
            e2e/package-lock.json
      - run: npm ci && npm run build
        working-directory: hyperloop-contracts
      - run: npm ci && npm run build
        working-directory: hyperloop-integrations
      - run: npm ci && npm run build
        working-directory: hyperloop-agent-runtime
      - run: npm ci && npm run build
        working-directory: hyperloop-control-plane
      - run: npm ci
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  teams-gateway:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hyperloop-contracts/package-lock.json
            hyperloop-teams-gateway/package-lock.json
      - run: npm ci && npm run build
        working-directory: hyperloop-contracts
      - run: npm ci
        working-directory: hyperloop-teams-gateway
      - run: npm run lint
        working-directory: hyperloop-teams-gateway
      - run: npm test
        working-directory: hyperloop-teams-gateway

  images:
    needs: [contracts, integrations, agent-runtime, control-plane, teams-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build six application images
        env:
          KIRO_CLI_VERSION: unpinned
          TAG_SUFFIX: ci-${{ github.sha }}
          VERSION: 0.1.0
          REVISION: ${{ github.sha }}
        run: ./scripts/build-images.sh
      - name: Control Plane must not contain kiro
        run: |
          docker run --rm --entrypoint sh "hyperloop/control-plane:ci-${{ github.sha }}" -c '! command -v kiro'
          docker run --rm --entrypoint sh "hyperloop/event-gateway:ci-${{ github.sha }}" -c '! command -v kiro'
          docker run --rm --entrypoint sh "hyperloop/teams-gateway:ci-${{ github.sha }}" -c '! command -v kiro'
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hyperloop/control-plane:ci-${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Push to Nexus (optional)
        # Enable by setting repository secrets NEXUS_REGISTRY / NEXUS_USERNAME / NEXUS_PASSWORD.
        # Absent secrets → step skipped (no invented registry coordinates).
        if: ${{ secrets.NEXUS_PASSWORD != '' }}
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          TAG: ci-${{ github.sha }}
        run: |
          if [ -z "${NEXUS_REGISTRY}" ] || [ -z "${NEXUS_USERNAME}" ]; then
            echo "NEXUS_PASSWORD set but NEXUS_REGISTRY/USERNAME missing" >&2
            exit 1
          fi
          echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
          for name in event-gateway control-plane teams-gateway kiro-agent-planner kiro-agent-coding kiro-agent-fix; do
            docker tag "hyperloop/${name}:${TAG}" "${NEXUS_REGISTRY}/hyperloop/${name}:${TAG}"
            docker push "${NEXUS_REGISTRY}/hyperloop/${name}:${TAG}"
            echo "${name}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          done
