asyncapi: 3.0.0
info:
  title: Hyperloop Events
  version: 0.1.0
channels:
  # Event Gateway → Control Plane (SQS queue: devspec-events)
  sddRevisionSubmitted:
    address: hyperloop.sdd_revision_submitted.v1
    description: Normalized SDD_REVISION_SUBMITTED from Event Gateway
  ciResultReceived:
    address: hyperloop.ci_result_received.v1
    description: Normalized CI_RESULT_RECEIVED from Event Gateway
  mrMerged:
    address: hyperloop.mr_merged.v1
    description: Normalized MR_MERGED from Event Gateway
  gitlabSddSubmitted:
    address: gitlab.sdd.dev_spec_submitted.v1
  specDecision:
    address: hyperloop.spec_decision.v1
  jenkinsCiCompleted:
    address: jenkins.ci_completed.v1
  gitlabMrMerged:
    address: gitlab.mr_merged.v1
  agentJobRequested:
    address: agent.job_requested.v1
  agentJobCompleted:
    address: agent.job_completed.v1
  notificationRequested:
    address: hyperloop.notification_requested.v1
  agentJobReady:
    address: agent.job_ready.v1
  agentSlotReleased:
    address: agent.slot_released.v1
  agentDispatchFailed:
    address: agent.dispatch_failed.v1
components:
  messages: {}
