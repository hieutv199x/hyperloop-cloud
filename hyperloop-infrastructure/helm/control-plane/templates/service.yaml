apiVersion: v1
kind: Service
metadata:
  name: control-plane-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "control-plane.api.selectorLabels" . | nindent 4 }}
