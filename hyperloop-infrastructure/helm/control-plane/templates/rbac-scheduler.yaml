{{- if .Values.rbac.createJobManagerRole }}
# Only control-plane-scheduler may create/get/list/watch/delete Jobs in hyperloop-agents.
# control-plane-api intentionally has no RoleBinding to this Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: control-plane-scheduler-jobs
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-scheduler
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames:
      - {{ .Values.env.AGENT_IMAGE_ALLOWLIST_CONFIGMAP | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: control-plane-scheduler-jobs
  namespace: {{ .Values.agentNamespace }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: control-plane-scheduler-jobs
subjects:
  - kind: ServiceAccount
    name: {{ include "control-plane.scheduler.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
