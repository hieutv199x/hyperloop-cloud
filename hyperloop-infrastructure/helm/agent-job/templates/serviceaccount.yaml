# Agent ServiceAccounts have no Kubernetes API permissions (no RoleBindings).
# IRSA/Pod Identity annotations grant AWS access only (S3, scoped secrets).
{{- range $role, $sa := .Values.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "agent-job.labels" $ | nindent 4 }}
    hyperloop.dev/agent-role: {{ $role }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
