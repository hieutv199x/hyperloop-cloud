apiVersion: v1
kind: Service
metadata:
  name: teams-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "teams-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "teams-gateway.selectorLabels" . | nindent 4 }}
