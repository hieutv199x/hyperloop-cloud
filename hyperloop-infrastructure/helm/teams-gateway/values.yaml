namespace: hyperloop-system
replicaCount: 2

image:
  repository: nexus.company.local/hyperloop/teams-gateway
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: teams-gateway
  annotations: {}

service:
  type: ClusterIP
  port: 8090

env:
  PORT: "8090"
  CONTROL_PLANE_BASE_URL: http://control-plane-api.hyperloop-system.svc.cluster.local:8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 5

podDisruptionBudget:
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
