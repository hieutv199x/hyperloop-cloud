apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: hyperloop-agents
spec:
  template:
    metadata:
      labels:
        hyperloop.dev/nodepool: agents
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: hyperloop-agents
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    cpu: "100"
    memory: 200Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
